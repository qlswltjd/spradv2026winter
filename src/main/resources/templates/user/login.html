<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>create user</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
</head>
<body>

*username : <input type="text" class="input_param" name="username" />
*password : <input type="password" class="input_param" name="password" />

<button onclick="login_user();">로그인</button>
<button onclick="get_access_token();">액세스토큰 실행</button>
<script>
    function login_user(){

        let _data = {};
        let input_param = $(".input_param");
        for(let each of input_param){
            _data[$(each).attr("name")] = $(each).val();
        }

        $.ajax({
            //
            url: '/api/user/login',
            method: 'POST',
            data : JSON.stringify(_data),
            contentType:"application/json",
            success: function (data, status, xhr) {
                /*
                alert("data :" + JSON.stringify(data));
                localStorage.setItem("userId", data.id);
                */
                // 프론트에서 header에서 꺼내 쓸때 아래처럼 꺼내 씀 getResponseHeader
                let refreshToken = xhr.getResponseHeader("RefreshToken");
                alert(refreshToken);

                alert("로그인 성공!");
                // 이후 프론트에서도 저장을 해야 해서 serItem으로 이거를 저장.
                localStorage.setItem("refreshToken", refreshToken);
                //location.replace("/index");
            },
            error: function (data, status, err) {
                alert("error :" + JSON.stringify(data));
            },
            complete: function () {
            }
        });
    }
    function get_access_token(){

        let refreshToken = localStorage.getItem("refreshToken");

        $.ajax({
            //
            url: '/api/auth',
            // header로 보내는거 beforeSend xhr.setRequestHeader
            beforeSend : function(xhr){
                xhr.setRequestHeader("RefreshToken", refreshToken);
            },
            method: 'POST',
            data : {},
            contentType:"application/json",
            success: function (data, status, xhr) {
                let accessToken = xhr.getResponseHeader("Authorization");
                alert(accessToken);
                alert("발급 성공!");
                localStorage.setItem("accessToken", accessToken);
                location.replace("/index");
            },
            error: function (data, status, err) {
                alert("error :" + JSON.stringify(data));
            },
            complete: function () {
            }
        });
    }
</script>

</body>
</html>
